name: dashboard

# Builds docs/index.html from progress.json and deploys it to GitHub Pages.
# Nothing is committed back, so your local branch never falls behind.
on:
  push:
    branches: [main]
  schedule:
    - cron: "30 0 * * *"  # daily, so "today's plan" and reviews due stay current
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Validate curriculum
        run: uv run python scripts/tracker.py validate
      - name: Build dashboard
        run: uv run python scripts/build_dashboard.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
