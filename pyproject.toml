[project]
name = "system-design-lab"
version = "0.1.0"
description = "Hands-on system design: concept explanations, ELI5 analogies and runnable Python + Docker labs."
requires-python = ">=3.11"
dependencies = [
    "dnspython>=2.9.0",
    "fastapi>=0.143.3",
    "grpcio>=1.84.0",
    "httpx>=0.28.1",
    "pyyaml>=6.0",
    "strawberry-graphql>=0.336.2",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

# Lessons add their own libraries here as they need them (`uv add redis`, `uv add fastapi`, ...).

[tool.pytest.ini_options]
addopts = "-q"
